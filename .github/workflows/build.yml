name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet fantomas --check src tests samples
      - run: dotnet restore CozNet.slnx --locked-mode
      - run: dotnet test CozNet.slnx -c Release --no-restore
      - run: dotnet build samples/CozNet.Serial/CozNet.Serial.fsproj -c Release --no-restore
